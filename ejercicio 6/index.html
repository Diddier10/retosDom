
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center p-6">

    <main class="w-full max-w-xl bg-white rounded-2xl shadow-lg p-8">

        <h1 class="text-2xl font-bold text-slate-800 mb-2">
            Calculadora de IMC
        </h1>

        <p class="text-slate-500 mb-6">
            Ingresa tu peso y estatura para realizar el cálculo.
        </p>

        <section class="space-y-4">

            <div>
                <label for="weight-input" class="block text-sm font-semibold text-slate-700 mb-2">
                    Peso (kilogramos)
                </label>

                <input
                    type="number"
                    id="weight-input"
                    placeholder="Ej. 70"
                    min="0"
                    step="any"
                    class="w-full border border-slate-300 rounded-xl p-4 outline-none focus:ring-2 focus:ring-blue-500"
                >
            </div>

            <div>
                <label for="height-input" class="block text-sm font-semibold text-slate-700 mb-2">
                    Estatura (metros)
                </label>

                <input
                    type="number"
                    id="height-input"
                    placeholder="Ej. 1.75"
                    min="0"
                    step="any"
                    class="w-full border border-slate-300 rounded-xl p-4 outline-none focus:ring-2 focus:ring-blue-500"
                >
            </div>

            <button
                id="calculate-button"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl p-4 transition-colors"
            >
                Calcular IMC
            </button>

        </section>

        <section class="mt-6">

            <h2 class="text-lg font-semibold text-slate-800 mb-3">
                Resultado
            </h2>

            <article class="bg-slate-50 border border-slate-200 rounded-xl p-5 min-h-20">

                <p id="result-output" class="text-slate-500">
                    Aquí aparecerá el resultado.
                </p>

            </article>

        </section>

    </main>

    <script src="script.js"></script>
</body>

</html>
