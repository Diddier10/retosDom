
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ejercicio 02 - Contador de clics</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">

    <main class="bg-white w-full max-w-md rounded-2xl shadow-lg p-8 text-center">

        <h1 class="text-2xl font-bold text-slate-800 mb-2">
            Contador de clics
        </h1>

        <p class="text-slate-500 mb-8">
            Presiona el botón para aumentar el contador.
        </p>

        <p
            id="contador"
            class="contador-numero text-6xl font-bold text-slate-800 mb-8"
            aria-live="polite"
        >
            0
        </p>
        <div class="flex flex-col sm:flex-row gap-3">

            <button
                id="btn-sumar"
                type="button"
                class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-5 rounded-lg transition-colors"
            >
                Sumar clic
            </button>

            <button
                id="btn-reiniciar"
                type="button"
                class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-800 font-semibold py-3 px-5 rounded-lg transition-colors"
            >
                Reiniciar
            </button>

        </div>

        <p class="text-sm text-slate-400 mt-6">
            El número cambiará a verde al llegar a 10.
        </p>

    </main>

</body>
</html>
