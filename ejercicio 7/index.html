
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de contraseña</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-100">

    <main class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold text-slate-800 mb-6">
            Verificador de contraseña
        </h1>

        <label for="password-input" class="block mb-2 font-medium">
            Escribe tu contraseña
        </label>

        <input
            type="password"
            id="password-input"
            placeholder="Ingresa una contraseña"
            class="w-full border border-slate-300 rounded-lg p-3 outline-none"
        >

        <p id="password-message" class="mt-3 text-sm">
            Escribe una contraseña para verificar su longitud.
        </p>
    </main>

    <script src="script.js"></script>
</body>
</html>
