
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vista previa de texto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center p-6">

    <main class="w-full max-w-xl bg-white rounded-2xl shadow-lg p-8">

        <h1 class="text-2xl font-bold text-slate-800 mb-2">
            Vista previa de texto
        </h1>

        <p class="text-slate-500 mb-6">
            Escribe algo y observa cómo aparece automáticamente.
        </p>

        <label for="text-input" class="block text-sm font-semibold text-slate-700 mb-2">
            Tu publicación
        </label>

        <textarea 
            id="text-input"
            placeholder="¿Qué estás pensando?"
            rows="5"
            class="w-full border border-slate-300 rounded-xl p-4 outline-none focus:ring-2 focus:ring-blue-500 resize-none"
        ></textarea>

        <section class="mt-6">
            <h2 class="text-lg font-semibold text-slate-800 mb-3">
                Vista previa
            </h2>

            <article class="bg-slate-50 border border-slate-200 rounded-xl p-5 min-h-28">
                <p id="text-preview" class="text-slate-700 whitespace-pre-wrap break-words">
                    Tu texto aparecerá aquí...
                </p>
            </article>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
