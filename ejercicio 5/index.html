<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensaje al presionar Enter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center p-6">

    <main class="w-full max-w-xl bg-white rounded-2xl shadow-lg p-8">

        <h1 class="text-2xl font-bold text-slate-800 mb-2">
            Registro de tareas
        </h1>

        <p class="text-slate-500 mb-6">
            Escribe una tarea y presiona Enter para registrarla.
        </p>

        <label for="task-input" class="block text-sm font-semibold text-slate-700 mb-2">
            Nueva tarea
        </label>

        <input
            type="text"
            id="task-input"
            placeholder="Escribe una tarea"
            class="w-full border border-slate-300 rounded-xl p-4 outline-none focus:ring-2 focus:ring-blue-500"
        >

        <section class="mt-6">

            <h2 class="text-lg font-semibold text-slate-800 mb-3">
                Resultado
            </h2>

            <article class="bg-slate-50 border border-slate-200 rounded-xl p-5 min-h-20">

                <p id="task-result" class="text-slate-700 break-words">
                    Aquí aparecerá tu nueva tarea.
                </p>

            </article>

        </section>

    </main>

    <script src="script.js"></script>
</body>

</html>
